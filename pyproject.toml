[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtp-codec"
version = "0.1.0"
description = "Compact TCR representations learned from reconstruction, TCRemP and generation probability"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "RTP-CODEC authors"}]
dependencies = [
    "torch>=2.4,<3", "numpy>=1.26,<3", "pandas>=2,<4", "pyarrow>=14",
    "tokenizers>=0.20,<1", "tqdm>=4", "scipy>=1.11", "scikit-learn>=1.4",
    "joblib>=1.3", "tidytcells>=2,<3", "rapidfuzz>=3,<4", "biopython>=1.81",
]

[project.optional-dependencies]
pgen = ["mirpy-lib @ git+https://github.com/antigenomics/mirpy.git@11a5fd1ac12edd22e12a2bb167ab9dfb55ccefd4"]
benchmarks = ["fair-esm", "transformers", "sceptr", "matplotlib>=3.8", "seaborn>=0.13"]
tracking = ["wandb"]
notebooks = ["jupyterlab", "matplotlib", "seaborn"]
dev = ["pytest>=8,<9", "matplotlib>=3.8"]

[project.scripts]
rtp-codec = "rtp_codec.cli:main"
rtp-codec-train = "rtp_codec.cli:train"
rtp-codec-encode = "rtp_codec.inference:main"

[project.urls]
Repository = "https://github.com/VEK239/rtp-codec"
Issues = "https://github.com/VEK239/rtp-codec/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
